name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

# Cancela execuções antigas do mesmo PR/branch quando um novo push chega,
# economizando minutos de Actions.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verificacoes:
    name: Lint, build e testes
    runs-on: ubuntu-latest

    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Instalar dependências
        run: npm ci

      # Os passos abaixo usam `!cancelled()` para que todos rodem mesmo que
      # um deles falhe — assim o PR mostra todos os problemas de uma vez.
      - name: Lint (ESLint)
        if: ${{ !cancelled() }}
        run: npm run lint

      - name: Type-check + build (tsc + vite)
        if: ${{ !cancelled() }}
        run: npm run build

      - name: Testes (Vitest)
        if: ${{ !cancelled() }}
        run: npm test

      # O nome dos arquivos do bundle muda a cada build, então os rótulos de
      # licença são gerados pelo próprio `npm run build`. Este passo confere que
      # o resultado ficou mesmo em conformidade — sem ele, uma mudança no
      # pipeline quebraria o site para quem usa LibreJS sem nenhum aviso.
      - name: Conformidade LibreJS
        if: ${{ !cancelled() }}
        run: npm run librejs:verify

      # Não gera o sitemap (isso bate na API e é feito à parte) — apenas confere o
      # arquivo versionado. A checagem que importa é o cruzamento com o robots.txt:
      # já houve `Disallow: /cifras` em produção bloqueando o acervo inteiro, e nada
      # no processo apontava a contradição.
      - name: Sitemap x robots.txt
        if: ${{ !cancelled() }}
        run: npm run sitemap:verify
